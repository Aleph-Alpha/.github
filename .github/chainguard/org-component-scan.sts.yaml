# Read-only access to every repository for the daily component scan in
# Aleph-Alpha/scheduled-workflows, from its main branch only.
# No repositories list: the token covers every repository the app is installed on.
issuer: https://token.actions.githubusercontent.com
subject: repo:Aleph-Alpha/scheduled-workflows:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: Aleph-Alpha/scheduled-workflows/\.github/workflows/org-component-scan\.yml@refs/heads/main
permissions:
  contents: read
